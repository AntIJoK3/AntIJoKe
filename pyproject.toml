[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypo-side"
version = "0.1.0"
description = "Fraud website graph detection prototype"
requires-python = ">=3.10"
# Keep in sync with requirements.txt (editable install pulls these deps).
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "neo4j>=5.14.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "tldextract>=5.1.0",
    "pyarrow>=12.0.0",
    "tqdm>=4.66.0",
    "torch>=2.0.0",
    "torch-geometric>=2.5.0",
    "sentence-transformers>=2.6.0",
    "networkx>=3.0",
    "dnspython>=2.6.0",
    "python-whois>=0.9.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["crypo_side*"]
